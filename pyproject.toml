[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kglw-manager"
version = "2.1.0"
description = "King Gizzard & The Lizard Wizard concert collection management tool"
authors = [
    {name = "KGLW Manager"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "rich>=12.0.0",
    "yt-dlp>=2025.08.20",
    "pyyaml>=6.0.2",
    "plexapi>=4.17.1",
    "diskcache>=5.6.3",
]

[project.scripts]
kglw-manager = "kglw_manager.cli:main"

[project.urls]
Homepage = "https://github.com/kglw-manager/kglw-manager"
Repository = "https://github.com/kglw-manager/kglw-manager"

[tool.uv]
dev-dependencies = [
    "mypy>=1.18.2",
    "pylint>=3.3.8",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
]

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.*)"

[tool.hatch.build.targets.wheel]
packages = ["kglw_manager"]
